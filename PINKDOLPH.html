<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Cosmic WAHLE Xperience — Stable Mobile</title>
<style>
:root{--pink:#ff63d1;--cyan:#5ceeff;--violet:#9c78ff;--glass:rgba(8,10,31,.66)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#01020a;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
body{touch-action:none}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;background:#01020a}
#hud{position:fixed;inset:0;pointer-events:none}
.glass{pointer-events:auto;background:linear-gradient(135deg,rgba(16,13,42,.78),rgba(5,9,28,.42));border:1px solid rgba(160,225,255,.27);box-shadow:0 0 25px rgba(116,70,255,.13),inset 0 0 25px rgba(255,255,255,.025);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
button,label{font:inherit}
button{color:#fff}
#top{position:absolute;left:10px;right:10px;top:calc(9px + env(safe-area-inset-top));display:flex;gap:8px;align-items:flex-start}
#brand{padding:10px 13px;border-radius:16px;min-width:196px}
#brand b{font-size:16px;letter-spacing:.11em;background:linear-gradient(90deg,#ff70d5,#5defff,#ae87ff);-webkit-background-clip:text;color:transparent}
#brand small{display:block;font-size:8px;letter-spacing:.2em;opacity:.62;margin-top:2px}
#track{flex:1;max-width:560px;padding:9px 12px;border-radius:16px}
#trackTitle{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bars{height:28px;display:flex;align-items:center;gap:2px}
#bars i{width:3px;height:6px;border-radius:4px;background:linear-gradient(#ff5bcf,#55efff)}
#time{display:flex;justify-content:space-between;font-size:8px;opacity:.5}
.topBtns{display:flex;gap:5px;margin-left:auto}
.iconBtn{width:43px;height:43px;border-radius:13px;border:1px solid rgba(190,235,255,.3);background:rgba(10,12,34,.6);cursor:pointer}
#left{position:absolute;left:10px;top:82px;width:137px}
.menu{border-radius:15px;overflow:hidden}
.menu button{width:100%;display:block;text-align:left;border:0;border-bottom:1px solid rgba(140,200,255,.1);background:transparent;padding:9px 10px;font-size:8px;letter-spacing:.08em;cursor:pointer}
.menu button.active,.cam.active,.action:active{background:rgba(255,87,205,.16);border-color:#ff72d7}
#theme{margin-top:7px;padding:9px;border-radius:14px;font-size:8px}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:7px}
.sw{display:block;height:18px;border-radius:50%;border:1px solid rgba(255,255,255,.3);cursor:pointer}
#actions{position:absolute;right:10px;top:95px;width:101px}
#actions .glass{padding:6px;border-radius:15px}
.action{width:100%;padding:8px 2px;margin:2px 0;border-radius:10px;background:rgba(17,15,43,.55);border:1px solid rgba(180,225,255,.24);cursor:pointer;font-size:8px;letter-spacing:.05em}
.action span{display:block;font-size:16px;margin-bottom:1px}
#joystick{position:absolute;left:12px;bottom:76px;width:100px;height:100px;border-radius:50%;overflow:hidden;touch-action:none}
#joystick:before{content:"";position:absolute;inset:12px;border:1px solid rgba(100,225,255,.4);border-radius:50%}
#joyKnob{position:absolute;left:31px;top:31px;width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff,#c8baff 12%,#57357e 52%,#11142d 78%);box-shadow:0 0 20px #786eff}
#camera{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:min(420px,calc(100% - 130px));padding:8px;border-radius:14px}
.cams{display:flex;gap:4px}
.cam{flex:1;padding:7px 2px;border-radius:9px;border:1px solid rgba(180,225,255,.23);background:rgba(17,15,43,.55);font-size:8px;cursor:pointer}
#zoomRow{display:flex;gap:6px;align-items:center;font-size:8px;opacity:.7;margin-top:5px}
#zoom{flex:1}
#upload{position:absolute;left:10px;bottom:8px;padding:10px 12px;border-radius:14px;font-size:9px;letter-spacing:.07em;cursor:pointer}
#upload input{display:none}
#hint{position:absolute;right:10px;bottom:13px;max-width:210px;text-align:right;font-size:8px;opacity:.48}
#toast{position:absolute;left:50%;top:62%;transform:translate(-50%,-50%);padding:11px 15px;border-radius:14px;background:rgba(8,8,25,.75);border:1px solid rgba(255,120,220,.45);font-size:10px;opacity:0;transition:.25s;pointer-events:none}
#toast.show{opacity:1}
.hidden #left,.hidden #actions,.hidden #joystick,.hidden #camera,.hidden #upload,.hidden #hint{opacity:0;pointer-events:none}
@media(max-width:700px){
 #brand{min-width:0}.brandtext{display:none}
 #track{display:none}.topBtns{margin-left:auto}
 #left{top:67px;width:122px}.menu button{padding:7px 9px;font-size:7px}
 #actions{top:78px;width:88px}.action{padding:6px 2px;font-size:7px}.action span{font-size:14px}
 #camera{width:calc(100% - 125px);left:auto;right:8px;transform:none}
 #joystick{width:92px;height:92px}.joy{}
 #joyKnob{left:28px;top:28px;width:36px;height:36px}
 #hint{display:none}
}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="hud">
  <div id="top">
    <div id="brand" class="glass"><b>COSMIC DOLPHIN</b><small>UTOPIAN XPERIENCE • OFFLINE SAFE</small></div>
    <div id="track" class="glass"><div id="trackTitle">COSMIC CURRENT • visual music engine</div><div id="bars"></div><div id="time"><span id="elapsed">00:00</span><span id="duration">--:--</span></div></div>
    <div class="topBtns">
      <button class="iconBtn" id="play">▶</button><button class="iconBtn" id="follow">◎</button><button class="iconBtn" id="hide">◉</button>
    </div>
  </div>
  <div id="left">
    <div class="menu glass">
      <button class="active">✦ OVERVIEW</button><button>◌ DOLPHIN</button><button>◎ WORLD</button><button>◈ VISUALS</button><button>♫ AUDIO</button><button>⌁ HUD</button>
    </div>
    <div id="theme" class="glass">DOLPHIN COLOR<div class="swatches">
      <i class="sw" data-c="#ff63d1" style="background:#ff63d1"></i><i class="sw" data-c="#5ceeff" style="background:#5ceeff"></i><i class="sw" data-c="#9c78ff" style="background:#9c78ff"></i><i class="sw" data-c="#8affb8" style="background:#8affb8"></i>
      <i class="sw" data-c="#ffd45e" style="background:#ffd45e"></i><i class="sw" data-c="#ff7959" style="background:#ff7959"></i><i class="sw" data-c="#ffffff" style="background:#fff"></i><i class="sw" data-c="#ff3f9f" style="background:#ff3f9f"></i>
    </div></div>
  </div>
  <div id="actions"><div class="glass">
    <button class="action" data-a="loop"><span>∞</span>LOOP</button>
    <button class="action" data-a="tornado"><span>◒</span>TORNADO</button>
    <button class="action" data-a="jelly"><span>☄</span>JELLY EFFECT</button>
    <button class="action" data-a="rings"><span>◎</span>BUBBLE RING</button>
    <button class="action" data-a="mirror"><span>◇</span>MIRROR BREAK</button>
    <button class="action" data-a="burst"><span>✦</span>STAR BURST</button>
  </div></div>
  <div id="joystick" class="glass"><div id="joyKnob"></div></div>
  <div id="camera" class="glass"><div class="cams">
    <button class="cam active" data-cam="follow">FOLLOW</button><button class="cam" data-cam="free">FREE</button><button class="cam" data-cam="cinematic">CINEMATIC</button><button class="cam" data-cam="overview">OVERVIEW</button>
  </div><div id="zoomRow">ZOOM <input id="zoom" type="range" min=".55" max="1.8" step=".01" value="1"></div></div>
  <label id="upload" class="glass">♫ UPLOAD MUSIC<input id="file" type="file" accept="audio/*"></label>
  <div id="hint">Joystick = swim • drag = free camera • scroll/pinch = zoom • tap a jelly</div>
  <div id="toast"></div>
</div>

<script>
(function(){
'use strict';
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d',{alpha:false});
const hud=document.getElementById('hud'),toast=document.getElementById('toast');
let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,1.5);
function resize(){DPR=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();

const stars=[],nodes=[],bubbles=[],crystals=[],jellies=[],particles=[],rings=[],mirrors=[];
const rand=(a,b)=>a+Math.random()*(b-a),pick=a=>a[(Math.random()*a.length)|0];
for(let i=0;i<650;i++)stars.push({x:Math.random(),y:Math.random(),z:rand(.1,1),s:rand(.4,2.2),tw:rand(0,7)});
for(let i=0;i<90;i++)nodes.push({x:rand(-20,20),z:rand(-28,6),p:rand(0,6.28)});
for(let i=0;i<35;i++)bubbles.push({x:rand(-1,1),y:rand(-.6,.8),z:rand(.1,1),r:rand(2,9),v:rand(.15,.45),a:rand(0,6.28)});
for(let i=0;i<12;i++)crystals.push({x:rand(-.9,.9),y:rand(-.35,.65),z:rand(.1,.9),r:rand(12,30),a:rand(0,6.28)});
for(let i=0;i<7;i++)jellies.push({x:rand(-.8,.8),y:rand(-.3,.7),z:rand(.2,.95),r:rand(18,30),phase:rand(0,6.28),hue:pick(['#ff61d1','#6cecff','#a681ff','#8affcf']),cool:0});
for(let i=0;i<8;i++)mirrors.push({x:rand(-.9,.9),y:rand(-.25,.7),z:rand(.25,.9),r:rand(14,28),a:rand(0,6.28)});

const dolphin={x:-.1,y:.08,depth:.42,rot:0,color:'#ff63d1',speed:0};
const joy={x:0,y:0};let camMode='follow',zoom=1,freeX=0,freeY=0,drag=false,lastX=0,lastY=0,t=0,last=performance.now();
let effect='';let effectTime=0;

function say(s){toast.textContent=s;toast.classList.add('show');clearTimeout(say.timer);say.timer=setTimeout(()=>toast.classList.remove('show'),1400)}
function project(x,y,z){ // simple immersive perspective
  const zz=Math.max(.08,z), scale=(.72/zz)*zoom;
  return {x:W/2+x*W*.42*scale,y:H*.53-y*H*.42*scale,scale}
}
function glowCircle(x,y,r,color,alpha=1){ctx.save();ctx.globalCompositeOperation='lighter';ctx.shadowBlur=r*.8;ctx.shadowColor=color;ctx.globalAlpha=alpha;ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.restore()}
function lineGlow(points,color,w=1,a=.6){ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=a;ctx.strokeStyle=color;ctx.lineWidth=w;ctx.shadowBlur=10;ctx.shadowColor=color;ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();ctx.restore()}

function background(){
  const g=ctx.createRadialGradient(W*.5,H*.46,0,W*.5,H*.5,Math.max(W,H)*.75);g.addColorStop(0,'#0a1640');g.addColorStop(.45,'#05071f');g.addColorStop(1,'#01020a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(const s of stars){const x=(s.x*W+(t*s.z*7)%W)%W,y=(s.y*H+t*s.z*2)%H,tw=.45+.55*Math.sin(t*2+s.tw);glowCircle(x,y,s.s*(.7+tw*.7),s.tw%2?'#65eaff':'#ff6bd4',tw)}
  // distant galaxy
  ctx.save();ctx.globalAlpha=.18;ctx.translate(W*.53,H*.43);ctx.rotate(-.25);const gg=ctx.createRadialGradient(0,0,5,0,0,W*.42);gg.addColorStop(0,'#ff55d2');gg.addColorStop(.35,'#6a58ff');gg.addColorStop(1,'transparent');ctx.fillStyle=gg;ctx.fillRect(-W*.5,-H*.25,W,H*.5);ctx.restore();
}
function grid(){
  ctx.save();ctx.globalAlpha=.27;ctx.lineWidth=1;
  for(let i=-14;i<=14;i++){const x=i/14;lineGlow([{x:W/2+x*W*.9,y:H*.69},{x:W/2+x*W*.17,y:H*.5}], '#35bce9',.7,.35)}
  for(let i=0;i<16;i++){const yy=H*.5+i*i/(15*15)*H*.38;lineGlow([{x:W*.08+i*W*.055,y:yy},{x:W*.92-i*W*.055,y:yy}], '#35bce9',.7,.35)}
  for(const n of nodes){const p=project(n.x/20,n.p*.03-.05,n.z/34+.35);glowCircle(p.x,p.y,1.1+1.2*(.5+.5*Math.sin(t*2+n.p)), '#65eaff', .75)}
  ctx.restore();
}
function drawJelly(j){
  const p=project(j.x,j.y,j.z),r=j.r*p.scale*1.15; if(r<2)return;
  const pulse=.9+.12*Math.sin(t*2.2+j.phase), rr=r*pulse;
  ctx.save();ctx.globalCompositeOperation='lighter';
  const grd=ctx.createRadialGradient(p.x,p.y-r*.2,1,p.x,p.y,rr*1.2);grd.addColorStop(0,'rgba(255,255,255,.8)');grd.addColorStop(.25,j.hue+'cc');grd.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=grd;ctx.beginPath();ctx.arc(p.x,p.y,rr*1.2,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=j.hue;ctx.shadowBlur=16;ctx.shadowColor=j.hue;ctx.lineWidth=Math.max(1,rr*.06);
  ctx.beginPath();ctx.arc(p.x,p.y,rr*.68,Math.PI,0);ctx.quadraticCurveTo(p.x+rr*.65,p.y+rr*.55,p.x,p.y+rr*.3);ctx.quadraticCurveTo(p.x-rr*.65,p.y+rr*.55,p.x-rr*.68,p.y);ctx.stroke();
  for(let k=-2;k<=2;k++){ctx.beginPath();ctx.moveTo(p.x+k*rr*.18,p.y+rr*.25);ctx.bezierCurveTo(p.x+k*rr*.25,p.y+rr*.7,p.x+k*rr*.05,p.y+rr*1.1,p.x+k*rr*.2,p.y+rr*1.35);ctx.stroke()}
  ctx.restore();
}
function drawDolphin(){
  const p=project(dolphin.x,dolphin.y,dolphin.depth),s=125*p.scale,lean=dolphin.rot;
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(lean);ctx.globalCompositeOperation='lighter';
  // bubble skin / halo
  ctx.shadowBlur=s*.18;ctx.shadowColor=dolphin.color;
  const shell=ctx.createRadialGradient(-s*.05,-s*.05,2,0,0,s*1.12);shell.addColorStop(0,'rgba(255,255,255,.35)');shell.addColorStop(.32,'rgba(120,238,255,.13)');shell.addColorStop(.8,'rgba(255,120,220,.08)');shell.addColorStop(1,'rgba(80,220,255,0)');
  ctx.fillStyle=shell;ctx.beginPath();ctx.ellipse(0,0,s*1.42,s*.7,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(135,242,255,.7)';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,0,s*1.47,s*.75,0,0,Math.PI*2);ctx.stroke();
  // body
  const body=ctx.createLinearGradient(-s,-s*.3,s,s*.3);body.addColorStop(0,'#8c2c91');body.addColorStop(.35,dolphin.color);body.addColorStop(.7,'#ff9de5');body.addColorStop(1,'#6d2c9d');
  ctx.fillStyle=body;ctx.beginPath();ctx.ellipse(0,0,s,s*.42,0,0,Math.PI*2);ctx.fill();
  // snout
  ctx.beginPath();ctx.moveTo(s*.7,-s*.08);ctx.quadraticCurveTo(s*1.25,-s*.2,s*1.5,0);ctx.quadraticCurveTo(s*1.25,s*.18,s*.7,s*.12);ctx.fill();
  // dorsal + fins
  ctx.beginPath();ctx.moveTo(-s*.15,-s*.34);ctx.lineTo(s*.05,-s*.7);ctx.lineTo(s*.25,-s*.25);ctx.fill();
  ctx.beginPath();ctx.moveTo(s*.15,s*.25);ctx.lineTo(s*.55,s*.65);ctx.lineTo(s*.48,s*.18);ctx.fill();
  // tail
  const flap=Math.sin(t*7)*.14;ctx.save();ctx.translate(-s*.92,0);ctx.rotate(flap);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-s*.48,-s*.38);ctx.lineTo(-s*.25,.02);ctx.lineTo(-s*.5,s*.38);ctx.closePath();ctx.fill();ctx.restore();
  // cyber grid
  ctx.strokeStyle='rgba(255,225,249,.34)';ctx.lineWidth=1;
  for(let k=-3;k<=3;k++){ctx.beginPath();ctx.ellipse(0,0,s*.96,s*(.39+k*.055),0,0,Math.PI*2);ctx.stroke()}
  for(let k=-4;k<=4;k++){ctx.beginPath();ctx.moveTo(k*s*.2,-s*.38);ctx.quadraticCurveTo(k*s*.12,0,k*s*.2,s*.38);ctx.stroke()}
  // eye
  glowCircle(s*.91,-s*.13,s*.055,'#fff',1);
  // trail particles
  for(let i=0;i<3;i++)glowCircle(-s*(1.35+i*.18),rand(-s*.08,s*.08),rand(1,3),dolphin.color,.8);
  ctx.restore();
}
function effects(){
  if(effectTime<=0)return;
  const q=1-effectTime/2;
  if(effect==='tornado'){for(let i=0;i<80;i++){const y=H*.32+q*H*.25+Math.sin(i*.4+t*3)*H*.12;const rr=(1-q)*W*.18+Math.abs(Math.sin(i*.31))*W*.04;const a=i*.32+t*2;glowCircle(W*.68+Math.cos(a)*rr,y,1.5,'#ff67d5',.7)}}
  if(effect==='loop'){ctx.save();ctx.translate(W*.7,H*.45);ctx.rotate(t*.2);for(let k=0;k<3;k++){ctx.strokeStyle=pick(['#ff65d2','#62efff','#a97aff']);ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<180;i++){const a=i/179*Math.PI*2,x=Math.sin(a)*W*.12,y=Math.sin(2*a)*H*.09;ctx.lineTo(x,y)}ctx.stroke()}ctx.restore()}
  if(effect==='rings'){for(const r of rings){r.r+=r.v;ctx.strokeStyle=r.c;ctx.lineWidth=2;ctx.globalAlpha=Math.max(0,1-r.r/260);ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.stroke()}ctx.globalAlpha=1}
  if(effect==='burst'){for(let i=0;i<90;i++){const a=i*2.4,rr=q*W*.25*(.2+(i%7)/7);glowCircle(dolphin.x*W*.2+W/2+Math.cos(a)*rr,dolphin.y*H*.2+H*.5+Math.sin(a)*rr,1.2,pick(['#ff6bd4','#63efff','#a47cff']),1-q)}}
  if(effect==='mirror'){for(const m of mirrors){const p=project(m.x,m.y,m.z),r=m.r*p.scale;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(m.a+t*.2);ctx.strokeStyle='rgba(190,240,255,.7)';ctx.shadowBlur=18;ctx.shadowColor='#70eaff';ctx.beginPath();ctx.moveTo(-r,0);ctx.lineTo(0,-r*.7);ctx.lineTo(r*.7,0);ctx.lineTo(0,r*.7);ctx.closePath();ctx.stroke();ctx.restore()}}
}
function update(dt){
  const manual=.012;dolphin.x+=joy.x*manual;dolphin.y-=joy.y*manual;dolphin.x=Math.max(-.8,Math.min(.8,dolphin.x));dolphin.y=Math.max(-.45,Math.min(.7,dolphin.y));
  if(Math.abs(joy.x)+Math.abs(joy.y)<.05){dolphin.x+=Math.sin(t*.35)*.0005;dolphin.y+=Math.sin(t*.9)*.00035}
  dolphin.rot+=(joy.x*.18-dolphin.rot)*.08;
  for(const j of jellies){j.y+=Math.sin(t*.45+j.phase)*.00035;j.x+=Math.cos(t*.32+j.phase)*.00025;if(j.cool>0)j.cool-=dt}
  for(const b of bubbles){b.y-=b.v*.001;if(b.y<-.7)b.y=.9}
  effectTime=Math.max(0,effectTime-dt);
  if(effectTime===0)effect='';
}
function render(){
  background();grid();
  const drawables=[...crystals.map(x=>({o:x,type:'c'})),...mirrors.map(x=>({o:x,type:'m'})),...jellies.map(x=>({o:x,type:'j'}))].sort((a,b)=>a.o.z-b.o.z);
  for(const d of drawables){
    if(d.type==='j')drawJelly(d.o);
    else {const p=project(d.o.x,d.o.y,d.o.z),r=d.o.r*p.scale;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(d.o.a+t*.15);ctx.globalCompositeOperation='lighter';ctx.strokeStyle=d.type==='m'?'#9befff':'#6eeaff';ctx.shadowBlur=12;ctx.shadowColor=ctx.strokeStyle;ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(-r,0);ctx.lineTo(0,-r*.7);ctx.lineTo(r*.7,0);ctx.lineTo(0,r*.7);ctx.closePath();ctx.stroke();ctx.restore()}
  }
  for(const b of bubbles){const x=W/2+b.x*W*.42/b.z,y=H*.55-b.y*H*.3/b.z,r=b.r/b.z;ctx.strokeStyle='rgba(120,235,255,.32)';ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke()}
  drawDolphin();effects();
}
function frame(now){const dt=Math.min(.033,(now-last)/1000);last=now;t+=dt;update(dt);render();requestAnimationFrame(frame)}
requestAnimationFrame(frame);

// joystick
const joyEl=document.getElementById('joystick'),knob=document.getElementById('joyKnob');
function setJoy(e){const r=joyEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,max=r.width*.34;let dx=e.clientX-cx,dy=e.clientY-cy,m=Math.hypot(dx,dy);if(m>max){dx*=max/m;dy*=max/m}joy.x=dx/max;joy.y=dy/max;knob.style.transform=`translate(${dx}px,${dy}px)`}
joyEl.addEventListener('pointerdown',e=>{joyEl.setPointerCapture(e.pointerId);setJoy(e)});joyEl.addEventListener('pointermove',e=>{if(e.buttons)setJoy(e)});['pointerup','pointercancel','pointerleave'].forEach(x=>joyEl.addEventListener(x,()=>{joy.x=joy.y=0;knob.style.transform='translate(0,0)'}));

// camera
canvas.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY});
canvas.addEventListener('pointermove',e=>{if(!drag||camMode!=='free')return;freeX+=(e.clientX-lastX)*.004;freeY+=(e.clientY-lastY)*.003;lastX=e.clientX;lastY=e.clientY});
canvas.addEventListener('pointerup',()=>drag=false);canvas.addEventListener('pointercancel',()=>drag=false);
canvas.addEventListener('wheel',e=>{zoom=Math.max(.55,Math.min(1.8,zoom*(1-e.deltaY*.0008)));document.getElementById('zoom').value=zoom},{passive:true});
document.getElementById('zoom').oninput=e=>zoom=+e.target.value;
document.querySelectorAll('.cam').forEach(b=>b.onclick=()=>{camMode=b.dataset.cam;document.querySelectorAll('.cam').forEach(x=>x.classList.toggle('active',x===b));say('Camera: '+camMode)});

// action buttons
function action(a){
  effect=a;effectTime=2.4;
  if(a==='jelly'){const j=jellies[(Math.random()*jellies.length)|0];j.cool=2.5;for(let i=0;i<30;i++)particles.push({x:j.x,y:j.y,z:j.z,vx:rand(-.01,.01),vy:rand(-.01,.01),life:1,c:pick(['#ff65d2','#65efff','#a77aff'])});say('Jelly activated • stardust bloom')}
  if(a==='rings'){rings.length=0;for(let i=0;i<4;i++)rings.push({x:W/2+dolphin.x*W*.25,y:H*.5+dolphin.y*H*.2,r:i*18,v:2+i*.7,c:pick(['#62efff','#ff65d2','#a47aff'])});say('Bubble ring wave')}
  if(a==='tornado')say('Tornado swim • spiral current');
  if(a==='loop')say('Infinity swim • loop current');
  if(a==='mirror')say('Mirror field awakened');
  if(a==='burst')say('Star burst');
  for(let i=0;i<80;i++)particles.push({x:W/2+dolphin.x*W*.2,y:H*.5+dolphin.y*H*.2,z:1,vx:rand(-2,2),vy:rand(-2,2),life:1,c:pick(['#ff65d2','#65efff','#a77aff'])});
}
document.querySelectorAll('.action').forEach(b=>b.onclick=()=>action(b.dataset.a));
document.getElementById('follow').onclick=()=>{camMode='follow';say('Follow camera')};
document.getElementById('hide').onclick=()=>hud.classList.toggle('hidden');

// jelly tap interaction
canvas.addEventListener('pointerup',e=>{
  if(camMode==='free')return;
  const x=e.clientX,y=e.clientY;
  for(const j of jellies){const p=project(j.x,j.y,j.z),r=Math.max(18,j.r*p.scale*1.4);if(Math.hypot(x-p.x,y-p.y)<r){j.cool=2.5;action('jelly');break}}
});

// music
let audio=null,ctxAudio=null,analyser=null,source=null,playing=false;
document.getElementById('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(!audio){audio=new Audio();audio.loop=true;ctxAudio=new (window.AudioContext||window.webkitAudioContext)();analyser=ctxAudio.createAnalyser();analyser.fftSize=64;source=ctxAudio.createMediaElementSource(audio);source.connect(analyser);analyser.connect(ctxAudio.destination)}audio.src=URL.createObjectURL(f);document.getElementById('trackTitle').textContent=f.name;await audio.play();playing=true;document.getElementById('play').textContent='Ⅱ';say('Music flowing')};
document.getElementById('play').onclick=async()=>{if(!audio){say('Upload music to begin');return}if(playing){audio.pause();playing=false;document.getElementById('play').textContent='▶'}else{await audio.play();playing=true;document.getElementById('play').textContent='Ⅱ'}};
document.getElementById('bars').innerHTML=Array.from({length:48},()=>'<i></i>').join('');
const bars=[...document.querySelectorAll('#bars i')];
setInterval(()=>{let a=.2;if(analyser){const ar=new Uint8Array(analyser.frequencyBinCount);analyser.getByteFrequencyData(ar);a=ar.reduce((x,y)=>x+y,0)/(ar.length*255)}bars.forEach((b,i)=>b.style.height=(5+(analyser?Math.random()*a*28:Math.max(4,10+Math.sin(t*3+i)*7)))+'px')},70);

// colors
document.querySelectorAll('.sw').forEach(s=>s.onclick=()=>{dolphin.color=s.dataset.c;say('Dolphin color changed')});
})();
</script>
</body>
</html>
